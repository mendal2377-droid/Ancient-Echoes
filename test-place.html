<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #0a0e0d; }
    .place-photo-hero {
      width: 240px;
      height: 240px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(216,176,114,0.22);
    }
    .place-illustration {
      width: 100%;
      height: 100%;
      display: block;
    }
    .place-illustration svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="place-photo-hero">
    <div class="place-illustration">
      <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="300" fill="#0c1513"/>
        <ellipse cx="200" cy="200" rx="140" ry="90" fill="#6fb6a6" opacity="0.35"/>
        <rect x="140" y="130" width="120" height="70" fill="#8b6914" opacity="0.6"/>
        <polygon points="140,130 200,80 260,130" fill="#d8b072" opacity="0.7"/>
        <rect x="155" y="145" width="8" height="55" fill="#d8b072" opacity="0.6"/>
        <rect x="240" y="145" width="8" height="55" fill="#d8b072" opacity="0.6"/>
        <rect x="100" y="210" width="200" height="8" fill="#d8b072" opacity="0.5"/>
        <circle cx="80" cy="160" r="25" fill="#6fb6a6" opacity="0.45"/>
        <circle cx="320" cy="170" r="28" fill="#6fb6a6" opacity="0.4"/>
      </svg>
    </div>
  </div>
  <p style="color: #e8e2d4; margin: 20px; font-family: sans-serif;">
    ✓ SVG is now 100% width and height with object-fit: contain<br>
    ✓ No padding reducing space<br>
    ✓ Illustration fills the entire 240px container
  </p>
</body>
</html>
